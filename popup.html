<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>핑키 플랜 - 파스텔 핑크 크롬 스케줄러</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="popup-mode">
  <!-- 상단 헤더 -->
  <header class="app-header">
    <div class="brand-section">
      <div class="brand-logo">🌸</div>
      <div>
        <div class="brand-title">핑키 플랜</div>
        <div class="brand-subtitle">나만의 핑크 스케줄러</div>
      </div>
    </div>
    <div class="header-actions">
      <!-- 계정 연동 칩 -->
      <button class="account-chip" id="btnAccountSync" style="padding: 4px 10px; font-size: 11px;" title="크롬 계정 클라우드 동기화">
        <span class="sync-status-dot" id="syncStatusDot"></span>
        <span id="accountChipText">☁️ 계정 연동</span>
      </button>
      <button class="btn-sync-refresh" id="btnManualSync" title="지금 새로고침">🔄</button>
      <button class="btn-kor-header" id="btnNewTab" style="padding: 4px 8px; font-size: 11px;" title="새 탭 전체화면으로 크게 열기">🖥️ 크게 보기</button>
      <button class="btn-kor-header" id="openModalBtn" style="padding: 4px 8px; font-size: 11px;" title="새 일정 등록">➕ 등록</button>
    </div>
  </header>

  <!-- 탭 메뉴 버튼 -->
  <nav class="nav-tabs">
    <button class="tab-btn active" data-tab="calendar">📅 달력 보기</button>
    <button class="tab-btn" data-tab="timeline">📋 전체 목록</button>
    <button class="tab-btn" data-tab="dday">⏳ 디데이 (D-Day)</button>
  </nav>

  <!-- 오늘의 요약 및 프로그레스 바 -->
  <section class="today-banner">
    <div class="banner-left">
      <div class="banner-date" id="todayBannerDate">📅 오늘 일정</div>
      <div class="banner-status" id="todayBannerStatus">오늘 일정을 불러오는 중입니다...</div>
    </div>
    <div class="banner-progress-wrap">
      <span class="banner-percent" id="bannerPercent">0% 달성</span>
      <div class="banner-progress-bar">
        <div class="banner-progress-fill" id="bannerProgressFill"></div>
      </div>
    </div>
  </section>

  <!-- 빠른 추가 입력창 -->
  <div class="quick-add-section">
    <div class="quick-input-wrap">
      <span class="quick-input-icon">✨</span>
      <input type="text" class="quick-input" id="quickInput" placeholder="오늘 할 일을 적고 Enter를 누르세요..." maxlength="60">
    </div>
    <button class="btn-add-primary" id="quickAddBtn">추가하기</button>
  </div>

  <!-- 메인 바디 컨텐츠 -->
  <main class="app-body">
    <!-- 탭 1: 캘린더 뷰 -->
    <div class="tab-content active" id="tab-calendar">
      <!-- 미니 월간 달력 -->
      <div class="calendar-card">
        <div class="calendar-header">
          <div class="cal-month-title" id="calMonthTitle">2026년 11월</div>
          <div class="cal-nav-buttons">
            <button class="cal-today-btn" id="calTodayBtn">오늘</button>
            <button class="cal-nav-btn" id="calPrevMonth" title="지난달">◀</button>
            <button class="cal-nav-btn" id="calNextMonth" title="다음달">▶</button>
          </div>
        </div>
        <div class="calendar-weekdays">
          <div class="weekday-sun">일</div>
          <div>월</div>
          <div>화</div>
          <div>수</div>
          <div>목</div>
          <div>금</div>
          <div class="weekday-sat">토</div>
        </div>
        <div class="calendar-days-grid" id="calDaysGrid">
          <!-- 자바스크립트로 자동 생성 -->
        </div>
      </div>

      <!-- 선택된 날짜의 일정 목록 -->
      <div class="schedule-section">
        <div class="section-header">
          <div class="section-title">
            <span id="selectedDateTitle">선택된 날짜 일정</span>
            <span class="section-badge" id="selectedDateCount">0건</span>
          </div>
        </div>
        <div class="schedule-list" id="scheduleList">
          <!-- 자바스크립트로 자동 생성 -->
        </div>
      </div>
    </div>

    <!-- 탭 2: 전체 타임라인 목록 -->
    <div class="tab-content" id="tab-timeline">
      <div class="schedule-section" style="padding-top: 14px;">
        <div class="schedule-list" id="timelineList">
          <!-- 자바스크립트로 자동 생성 -->
        </div>
      </div>
    </div>

    <!-- 탭 3: D-Day 디데이 카드 뷰 -->
    <div class="tab-content" id="tab-dday">
      <div class="dday-grid" id="ddayGrid">
        <!-- 자바스크립트로 자동 생성 -->
      </div>
    </div>
  </main>

  <!-- 계정 동기화 모달 (크롬 계정 + 비밀번호 보호) -->
  <div class="modal-overlay" id="accountModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">☁️ 크롬 계정 클라우드 동기화</div>
        <button class="modal-close-btn" id="accountModalCloseBtn">&times;</button>
      </div>
      <div class="modal-form">
        <div class="account-card-info">
          🌸 <strong>두 대 이상의 PC에서 안전하게 연동하기</strong><br>
          이메일과 비밀번호를 입력하시면 <strong>🔒 AES-256 암호화</strong>가 적용되어 다른 PC에서도 비밀번호를 입력해야만 일정이 열립니다.
        </div>

        <div class="form-group" id="accountInputGroup">
          <label class="form-label" for="syncEmailInput">크롬 / 구글 이메일 주소</label>
          <input type="email" id="syncEmailInput" class="form-input" placeholder="예: myaccount@gmail.com" required>
        </div>

        <div class="form-group" id="accountPassGroup">
          <label class="form-label" for="syncPasswordInput">동기화 비밀번호 (4자리 이상)</label>
          <input type="password" id="syncPasswordInput" class="form-input" placeholder="비밀번호 또는 PIN 번호 입력" required>
        </div>

        <div id="accountLoggedInGroup" style="display: none;">
          <div style="background: var(--pink-100); padding: 12px; border-radius: var(--radius-sm); text-align: center; margin-bottom: 10px;">
            <div style="font-size: 13px; font-weight: 700; color: var(--pink-600);" id="loggedInEmailText">user@gmail.com</div>
            <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">🔒 AES-256 암호화 보호 중 (실시간 동기화 🟢)</div>
          </div>
        </div>

        <div class="modal-footer" style="margin: 8px -20px -20px; padding: 12px 20px;">
          <button type="button" class="btn-secondary" id="accountModalCancelBtn">닫기</button>
          <button type="button" class="btn-secondary" id="accountLogoutBtn" style="display: none; color: #E84D67; border-color: #FFAAA6;">연동 해제</button>
          <button type="button" class="btn-primary" id="accountSaveBtn">보안 동기화 시작</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 일정 추가 및 수정 모달 -->
  <div class="modal-overlay" id="scheduleModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">🌸 새 일정 등록하기</div>
        <button class="modal-close-btn" id="modalCloseBtn">&times;</button>
      </div>
      <form class="modal-form" id="modalForm">
        <div class="form-group">
          <label class="form-label" for="modalTitleInput">일정 제목</label>
          <input type="text" id="modalTitleInput" class="form-input" placeholder="어떤 일정이 있나요?" required maxlength="80">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="modalDateInput">날짜</label>
            <input type="date" id="modalDateInput" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="modalTimeInput">시간</label>
            <input type="time" id="modalTimeInput" class="form-input" value="12:00">
          </div>
        </div>

        <div class="form-options-row">
          <label class="form-checkbox-label">
            <input type="checkbox" id="modalAllDayInput" class="chk-custom">
            <span>하루 종일 (시간 미지정)</span>
          </label>
          <label class="form-checkbox-label">
            <input type="checkbox" id="modalImportantInput" class="chk-custom">
            <span>중요 표시 (⭐)</span>
          </label>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="modalCategoryInput">카테고리</label>
            <select id="modalCategoryInput" class="form-select">
              <option value="personal">🌸 개인·일상 (약속·휴식)</option>
              <option value="work">💼 공부·업무 (시험·과제)</option>
              <option value="anniversary">🎂 특별한 날 (생일·기념일)</option>
              <option value="routine">🌿 루틴·건강 (운동·습관)</option>
              <option value="study">📚 스터디·독서</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">알림 설정</label>
            <div style="height: 38px; display: flex; align-items: center;">
              <label class="form-checkbox-label">
                <input type="checkbox" id="modalNotifyInput" class="chk-custom" checked>
                <span>시작 시간에 알림 받기</span>
              </label>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="modalMemoInput">메모 (선택 사항)</label>
          <textarea id="modalMemoInput" class="form-textarea" placeholder="장소, 준비물, 챙길 것 등을 적어보세요."></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-secondary" id="modalCancelBtn">취소</button>
          <button type="submit" class="btn-primary" id="modalSaveBtn">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 토스트 알림 컨테이너 -->
  <div class="toast" id="appToast"></div>

  <!-- 스크립트 연결 -->
  <script src="cloudSync.js"></script>
  <script src="app.js"></script>
</body>
</html>
